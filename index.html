<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma de Jogos | Tower Leap 2D</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    
    body {
      background: #121c12;
      color: #fff;
      font-family: 'Press Start 2P', cursive, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Menu Superior da Plataforma */
    #navbar {
      width: 100%;
      height: 50px;
      background: #1b3022;
      border-bottom: 4px solid #2e7d32;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      z-index: 100;
    }

    .nav-logo {
      color: #ffd700;
      font-size: 10px;
      text-shadow: 2px 2px #000;
    }

    .nav-menu {
      display: flex;
      gap: 15px;
    }

    .nav-item {
      color: #e2d8b3;
      font-size: 8px;
      text-decoration: none;
      padding: 6px 10px;
      border-radius: 4px;
      background: #2d4a35;
      border: 2px solid #1b3022;
      transition: 0.1s;
      cursor: pointer;
    }

    .nav-item:hover, .nav-item.active {
      background: #4a7c59;
      color: #fff;
      border-color: #ffd700;
    }

    /* Container do Jogo */
    #main-content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    #game-container {
      position: relative;
      display: flex;
      border: 6px solid #2d1810;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      background: #87ceeb;
    }

    #shop-panel {
      width: 210px;
      height: 500px;
      background: #5c3a21;
      border-right: 6px solid #3d2314;
      outline: 4px solid #2e7d32;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
    }

    h2 {
      color: #ffd700;
      font-size: 10px;
      text-align: center;
      line-height: 1.4;
      margin-bottom: 10px;
      text-shadow: 2px 2px #000;
    }

    .ui-info {
      font-size: 7px;
      color: #e2d8b3;
      margin-bottom: 8px;
      line-height: 1.4;
      text-shadow: 1px 1px #000;
    }

    .btn {
      background: #4a7c59;
      color: #fff;
      border: 3px solid #2d4a35;
      padding: 8px 5px;
      margin: 5px 0;
      font-family: 'Press Start 2P', cursive;
      font-size: 6px;
      line-height: 1.3;
      cursor: pointer;
      border-radius: 4px;
      box-shadow: 0 3px #1b3022;
      transition: all 0.1s;
    }
    .btn:hover:not(:disabled) {
      background: #5b996f;
      transform: translateY(-2px);
      box-shadow: 0 5px #1b3022;
    }
    .btn:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 1px #1b3022;
    }
    .btn:disabled {
      background: #3a473d;
      color: #7a8a7e;
      border-color: #252e27;
      box-shadow: none;
      cursor: not-allowed;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
    }

    .hud-top {
      position: absolute;
      top: 12px;
      right: 15px;
      font-size: 8px;
      color: #ffffff;
      text-shadow: 2px 2px #000;
      pointer-events: none;
      display: flex;
      gap: 15px;
      z-index: 20;
    }
  </style>
</head>
<body>

  <!-- Menu da Plataforma -->
  <nav id="navbar">
    <div class="nav-logo">🎮 PLATAFORMA HUB</div>
    <div class="nav-menu">
      <a href="#" class="nav-item active">Tower Leap</a>
      <a href="#" class="nav-item">Em Breve</a>
      <a href="#" class="nav-item">Conquistas</a>
    </div>
  </nav>

  <!-- Área Principal com o Jogo -->
  <div id="main-content">
    <div id="game-container">
      <div id="shop-panel">
        <div>
          <h2>LOJINHA 🌿</h2>
          <div class="ui-info" id="stats-info">Bicho: Pintinho 🐥</div>
          <div class="ui-info" id="flaps-info">Pulos no ar: 2</div>
          
          <button id="buy-tower" class="btn" onclick="buyTower()">Aumentar Torre<br><span id="cost-tower">10 moedas</span></button>
          <button id="buy-pet" class="btn" onclick="buyPet()">Evoluir Bicho<br><span id="cost-pet">50 moedas</span></button>
        </div>

        <div class="ui-info" style="color: #a3e635; font-size: 6px; line-height: 1.4;">
          Como joga:<br>
          A/D - Anda<br>
          W - Pula<br>
          Espaço/W no ar - Bate asa
        </div>
      </div>

      <div style="position: relative;">
        <div class="hud-top">
          <div id="coin-display">💰 0</div>
          <div id="record-display">🏆 0m</div>
        </div>
        <canvas id="canvas" width="720" height="500"></canvas>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let coins = 0;
    let maxDistance = 0;
    let gameState = 'TOWER';

    const spriteSheet = new Image();
    let isLoaded = false;
    
    spriteSheet.onload = () => { isLoaded = true; };
    spriteSheet.src = 'bichos.png-removebg-preview.png';

    const animals = [
      { name: "Pintinho 🐥", speed: 5, gravity: 0.22, flapPower: -5.5, maxFlaps: 2, frame: 0, w: 42, h: 42 },
      { name: "Galinha 🐔", speed: 6.5, gravity: 0.20, flapPower: -6.5, maxFlaps: 3, frame: 1, w: 45, h: 45 },
      { name: "Passarinho 🐦", speed: 8, gravity: 0.17, flapPower: -7.0, maxFlaps: 4, frame: 2, w: 48, h: 42 },
      { name: "Águia 🦅", speed: 10, gravity: 0.14, flapPower: -8.0, maxFlaps: 6, frame: 3, w: 52, h: 52 },
      { name: "Dragão 🐉", speed: 13, gravity: 0.11, flapPower: -9.0, maxFlaps: 10, frame: 4, w: 58, h: 58 }
    ];

    let towerLevel = 1;
    let petIndex = 0;

    const keys = { a: false, d: false, w: false, space: false };

    let player = {
      x: 80,
      y: 0,
      vx: 0,
      vy: 0,
      isGrounded: false,
      flapsLeft: 0,
      width: 42,
      height: 42
    };

    let cameraX = 0;
    let cameraY = 0;

    window.addEventListener('keydown', (e) => {
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.a = true;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.d = true;
      if (e.code === 'KeyW' || e.code === 'ArrowUp') {
        if (!keys.w) handleJump();
        keys.w = true;
      }
      if (e.code === 'Space') {
        if (!keys.space) handleJump();
        keys.space = true;
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.a = false;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.d = false;
      if (e.code === 'KeyW' || e.code === 'ArrowUp') keys.w = false;
      if (e.code === 'Space') keys.space = false;
    });

    function updateUI() {
      document.getElementById('coin-display').innerText = `💰 ${Math.floor(coins)}`;
      document.getElementById('record-display').innerText = `🏆 ${Math.floor(maxDistance)}m`;
      
      const currentPet = animals[petIndex];
      document.getElementById('stats-info').innerText = `Bicho: ${currentPet.name}`;
      document.getElementById('flaps-info').innerText = `Pulos no ar: ${currentPet.maxFlaps}`;
      
      const towerCost = Math.floor(10 * Math.pow(1.5, towerLevel - 1));
      document.getElementById('buy-tower').disabled = coins < towerCost;
      document.getElementById('buy-tower').innerHTML = `Aumentar Torre (Nv.${towerLevel})<br><span id="cost-tower">${towerCost} moedas</span>`;

      if (petIndex < animals.length - 1) {
        const petCost = Math.floor(50 * Math.pow(2.0, petIndex));
        document.getElementById('buy-pet').disabled = coins < petCost;
        document.getElementById('buy-pet').innerHTML = `Evoluir Bicho<br><span id="cost-pet">${petCost} moedas</span>`;
      } else {
        document.getElementById('buy-pet').disabled = true;
        document.getElementById('buy-pet').innerHTML = `Virou o Dragão!`;
      }
    }

    function buyTower() {
      const cost = Math.floor(10 * Math.pow(1.5, towerLevel - 1));
      if (coins >= cost) {
        coins -= cost;
        towerLevel++;
        resetToTower();
        updateUI();
      }
    }

    function buyPet() {
      const cost = Math.floor(50 * Math.pow(2.0, petIndex));
      if (coins >= cost && petIndex < animals.length - 1) {
        coins -= cost;
        petIndex++;
        
        player.width = animals[petIndex].w;
        player.height = animals[petIndex].h;
        
        resetToTower();
        updateUI();
      }
    }

    function resetToTower() {
      gameState = 'TOWER';
      const groundY = canvas.height - 60;
      const towerHeight = 120 + (towerLevel * 50);
      
      player.x = 80;
      player.y = groundY - towerHeight - player.height;
      player.vx = 0;
      player.vy = 0;
      player.isGrounded = true;
      player.flapsLeft = animals[petIndex].maxFlaps;
    }

    function handleJump() {
      if (gameState === 'TOWER') {
        if (player.isGrounded) {
          player.vy = -7.5;
          player.isGrounded = false;
        }
      } else if (gameState === 'FLYING') {
        if (player.flapsLeft > 0) {
          player.vy = animals[petIndex].flapPower;
          player.flapsLeft--;
        }
      }
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const towerWidth = 220;
      const groundY = canvas.height - 60;
      const towerHeight = 120 + (towerLevel * 50);
      const towerTopY = groundY - towerHeight;

      if (gameState === 'TOWER') {
        if (keys.a) player.vx = -3.5;
        else if (keys.d) player.vx = 3.5;
        else player.vx = 0;

        player.vy += 0.35;
        player.x += player.vx;
        player.y += player.vy;

        if (player.x < 15) player.x = 15;

        if (player.x <= towerWidth) {
          if (player.y >= towerTopY - player.height) {
            player.y = towerTopY - player.height;
            player.vy = 0;
            player.isGrounded = true;
          }
        } else {
          gameState = 'FLYING';
          player.isGrounded = false;
          player.vx = animals[petIndex].speed + (player.vx > 0 ? 2 : 0);
          
          if (player.vy < 0) {
            player.vy -= 2.5;
            player.vx += 2.0;
          }
        }
      } else if (gameState === 'FLYING') {
        player.vy += animals[petIndex].gravity;
        player.x += player.vx;
        player.y += player.vy;

        player.vx = Math.max(1.5, player.vx - 0.004);

        if (player.y >= groundY - player.height) {
          player.y = groundY - player.height;
          gameState = 'GAMEOVER';

          const distanceEarned = Math.floor(player.x - towerWidth);
          const earnedCoins = Math.max(0, Math.floor(distanceEarned / 12));
          coins += earnedCoins;
          if (distanceEarned > maxDistance) maxDistance = distanceEarned;

          setTimeout(() => {
            resetToTower();
            updateUI();
          }, 1200);
        }
      }

      cameraX = Math.max(0, player.x - 150);
      cameraY = player.y - 250;

      ctx.save();
      ctx.translate(-cameraX, -cameraY);

      // Céu
      ctx.fillStyle = '#87ceeb';
      ctx.fillRect(cameraX, cameraY, canvas.width, canvas.height);

      // Nuvens
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.fillRect(150, cameraY + 80, 80, 25);
      ctx.fillRect(500, cameraY + 150, 90, 25);
      ctx.fillRect(900, cameraY + 60, 100, 30);

      // Torre
      ctx.fillStyle = '#8b4513';
      ctx.fillRect(0, towerTopY, towerWidth, towerHeight);

      ctx.fillStyle = '#6a320b';
      for (let ty = towerTopY; ty < groundY; ty += 16) {
        for (let tx = 0; tx < towerWidth; tx += 32) {
          let shift = (Math.floor(ty / 16) % 2 === 0) ? 0 : 16;
          ctx.fillRect(tx + shift, ty, 30, 14);
        }
      }

      ctx.fillStyle = '#4ca64c';
      ctx.fillRect(0, towerTopY - 6, towerWidth + 4, 8);
      ctx.fillStyle = '#2e7d32';
      ctx.fillRect(0, towerTopY - 2, towerWidth + 4, 4);

      // Chão
      ctx.fillStyle = '#8b5a2b';
      ctx.fillRect(-200, groundY, cameraX + canvas.width + 500, 1000);
      ctx.fillStyle = '#4ca64c';
      ctx.fillRect(-200, groundY, cameraX + canvas.width + 500, 12);
      ctx.fillStyle = '#2e7d32';
      ctx.fillRect(-200, groundY + 10, cameraX + canvas.width + 500, 4);

      // Marcadores
      ctx.fillStyle = '#fff';
      ctx.font = '7px "Press Start 2P"';
      for (let d = 300; d < player.x + 1000; d += 150) {
        ctx.fillRect(d, groundY, 4, 16);
        ctx.fillText(`${d - towerWidth}m`, d - 12, groundY + 32);
      }

      // Renderiza sprite do bicho
      const currentAnimal = animals[petIndex];
      if (isLoaded && spriteSheet.naturalWidth > 0) {
        const frameWidth = spriteSheet.naturalWidth / 5;
        const frameHeight = spriteSheet.naturalHeight;

        ctx.drawImage(
          spriteSheet,
          currentAnimal.frame * frameWidth, 0, frameWidth, frameHeight,
          player.x, player.y, player.width, player.height
        );
      }

      if (gameState === 'FLYING') {
        ctx.fillStyle = '#2e7d32';
        ctx.font = '7px "Press Start 2P"';
        ctx.fillText(`Pulos:${player.flapsLeft}`, player.x - 10, player.y - 10);
      }

      ctx.restore();

      requestAnimationFrame(gameLoop);
    }

    resetToTower();
    updateUI();
    gameLoop();
  </script>
</body>
</html>
