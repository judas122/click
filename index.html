<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma de Jogos</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #121c12;
      color: #fff;
      font-family: 'Press Start 2P', cursive;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    #navbar {
      width: 100%;
      height: 60px;
      background: #1b3022;
      border-bottom: 4px solid #2e7d32;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
    }
    .nav-logo { color: #ffd700; font-size: 12px; }
    .nav-menu { display: flex; gap: 10px; }
    .nav-item {
      color: #fff;
      font-size: 8px;
      text-decoration: none;
      padding: 8px 12px;
      background: #2d4a35;
      border: 2px solid #1b3022;
      border-radius: 4px;
    }
    .nav-item:hover { background: #4a7c59; }
    #game-frame {
      width: 100%;
      height: calc(100vh - 60px);
      border: none;
    }
  </style>
</head>
<body>

  <nav id="navbar">
    <div class="nav-logo">🎮 MINHA PLATAFORMA</div>
    <div class="nav-menu">
      <a href="anomalia.html" target="game-iframe" class="nav-item">Anomalia</a>
      <a href="jump.html" target="game-iframe" class="nav-item">Jogo da Torre</a>
    </div>
  </nav>

  <iframe name="game-iframe" id="game-frame" src="anomalia.html"></iframe>

</body>
</html>
