<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ping Pong Clássico 3D - Pro Edition</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      overflow: hidden;
      background-color: #0b0d12;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      display: block;
      cursor: none;
    }
    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #ffffff;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .score-board {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      padding: 14px 28px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .score-board span {
      color: #38bdf8;
      font-size: 28px;
    }
    #menu {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      color: #f8fafc;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      pointer-events: auto;
      min-width: 360px;
      cursor: default;
    }
    h1 {
      font-size: 32px;
      margin-bottom: 12px;
      color: #38bdf8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 800;
    }
    p {
      margin-bottom: 24px;
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;
    }
    .diff-btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .facil { background: #10b981; }
    .medio { background: #f59e0b; }
    .dificil { background: #ef4444; }
    .impossivel { background: #8b5cf6; }
    .diff-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      filter: brightness(1.1);
    }
    #hit-prompt {
      position: absolute;
      bottom: 15%;
      left: 50%;
      transform: translateX(-50%);
      color: #38bdf8;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 2px;
      opacity: 0;
      transition: opacity 0.15s ease;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="game-container"></div>

  <div id="ui">
    <div class="hud">
      <div class="score-board">JOGADOR <span id="player-score">0</span></div>
      <div class="score-board">BOT <span id="bot-score">0</span></div>
    </div>
    <div id="hit-prompt">CLIQUE PARA REBATER!</div>
  </div>

  <div id="menu">
    <h1>Ping Pong Pro</h1>
    <p>A raquete segue o seu mouse.<br>Rebata a bola dentro da mesa adversária!</p>
    <button class="diff-btn facil" onclick="startGame('facil')">Fácil</button>
    <button class="diff-btn medio" onclick="startGame('medio')">Médio</button>
    <button class="diff-btn dificil" onclick="startGame('dificil')">Difícil</button>
    <button class="diff-btn impossivel" onclick="startGame('impossivel')">Impossível</button>
  </div>

  <script>
    // Áudio SFX
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'hit') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(350, now);
        osc.frequency.exponentialRampToValueAtTime(90, now + 0.08);
        gain.gain.setValueAtTime(0.8, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'bounce') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(550, now);
        osc.frequency.exponentialRampToValueAtTime(180, now + 0.05);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
        osc.start(now);
        osc.stop(now + 0.05);
      } else if (type === 'score') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.12);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
      }
    }

    // Variáveis 3D
    let scene, camera, renderer;
    let table, ball, playerPaddleGroup, botPaddleGroup;
    
    const TABLE_WIDTH = 14;
    const TABLE_DEPTH = 26;
    const GRAVITY = -0.008;

    let playerScore = 0;
    let botScore = 0;
    let currentDifficulty = 'medio';
    let gameActive = false;

    let ballVelocity = new THREE.Vector3(0, 0, 0);
    let mousePos = { x: 0, y: 0 };
    let isHitting = false;

    let lastHitter = null;
    let tableBounces = 0;

    const botConfig = {
      facil: { speed: 0.06, precision: 0.65 },
      medio: { speed: 0.12, precision: 0.85 },
      dificil: { speed: 0.22, precision: 0.95 },
      impossivel: { speed: 0.42, precision: 1.0 }
    };

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0f172a);
      scene.fog = new THREE.FogExp2(0x0f172a, 0.015);

      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 8.5, 17.5);
      camera.lookAt(0, 0, -2);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;
      document.getElementById('game-container').appendChild(renderer.domElement);

      // Luzes do Cenário
      const ambientLight = new THREE.AmbientLight(0x38bdf8, 0.25);
      scene.add(ambientLight);

      const mainLight = new THREE.SpotLight(0xffffff, 2.0);
      mainLight.position.set(0, 25, 0);
      mainLight.angle = Math.PI / 3;
      mainLight.penumbra = 0.5;
      mainLight.castShadow = true;
      mainLight.shadow.mapSize.width = 2048;
      mainLight.shadow.mapSize.height = 2048;
      scene.add(mainLight);

      // Luz de preenchimento azulada para o fundo
      const fillLight = new THREE.DirectionalLight(0x1e3a8a, 0.8);
      fillLight.position.set(0, 10, -20);
      scene.add(fillLight);

      createEnvironment();
      createTable();
      
      playerPaddleGroup = createRealisticPaddle(0xef4444); // Vermelha
      botPaddleGroup = createRealisticPaddle(0x3b82f6);    // Azul
      
      playerPaddleGroup.position.set(0, 1.2, TABLE_DEPTH / 2 - 1);
      botPaddleGroup.position.set(0, 1.2, -TABLE_DEPTH / 2 + 1);
      botPaddleGroup.rotation.y = Math.PI;

      scene.add(playerPaddleGroup);
      scene.add(botPaddleGroup);

      createBall();

      window.addEventListener('resize', onWindowResize);
      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mousedown', onMouseClick);

      animate();
    }

    function createEnvironment() {
      // Chão Polido
      const floorGeo = new THREE.PlaneGeometry(100, 100);
      const floorMat = new THREE.MeshStandardMaterial({ 
        color: 0x090d16, 
        roughness: 0.2, 
        metalness: 0.5 
      });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -5;
      floor.receiveShadow = true;
      scene.add(floor);

      // Paredes do Cenário (Arena)
      const wallMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.8 });
      
      const backWall = new THREE.Mesh(new THREE.PlaneGeometry(100, 40), wallMat);
      backWall.position.set(0, 15, -40);
      scene.add(backWall);

      // Moldura de LED Neon nas paredes de fundo
      const neonGeo = new THREE.BoxGeometry(40, 0.2, 0.2);
      const neonMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
      const neonTop = new THREE.Mesh(neonGeo, neonMat);
      neonTop.position.set(0, 18, -39.8);
      scene.add(neonTop);
    }

    function createTable() {
      // Tampo da Mesa Profissional
      const tableGeo = new THREE.BoxGeometry(TABLE_WIDTH, 0.5, TABLE_DEPTH);
      const tableMat = new THREE.MeshStandardMaterial({ 
        color: 0x0f4c81, // Azul Oficial de Competição
        roughness: 0.35, 
        metalness: 0.1 
      });
      table = new THREE.Mesh(tableGeo, tableMat);
      table.position.y = -0.25;
      table.receiveShadow = true;
      scene.add(table);

      // Linhas Brancas da Mesa
      const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      
      const side1 = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.52, TABLE_DEPTH), lineMat);
      side1.position.x = TABLE_WIDTH / 2;
      table.add(side1);

      const side2 = side1.clone();
      side2.position.x = -TABLE_WIDTH / 2;
      table.add(side2);

      const lineCenter = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.52, TABLE_DEPTH), lineMat);
      table.add(lineCenter);

      // Pés da Mesa (Estrutura Metálica)
      const legGeo = new THREE.BoxGeometry(0.6, 5, 0.6);
      const legMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.8, roughness: 0.2 });
      const positions = [
        [-TABLE_WIDTH/2 + 0.8, -2.75, TABLE_DEPTH/2 - 0.8],
        [TABLE_WIDTH/2 - 0.8, -2.75, TABLE_DEPTH/2 - 0.8],
        [-TABLE_WIDTH/2 + 0.8, -2.75, -TABLE_DEPTH/2 + 0.8],
        [TABLE_WIDTH/2 - 0.8, -2.75, -TABLE_DEPTH/2 + 0.8]
      ];
      positions.forEach(pos => {
        const leg = new THREE.Mesh(legGeo, legMat);
        leg.position.set(...pos);
        leg.castShadow = true;
        scene.add(leg);
      });

      // Rede
      const netGeo = new THREE.BoxGeometry(TABLE_WIDTH + 0.6, 0.8, 0.05);
      const netMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.75, wireframe: true });
      const net = new THREE.Mesh(netGeo, netMat);
      net.position.set(0, 0.4, 0);
      net.castShadow = true;
      scene.add(net);

      // Suportes da Rede
      const postGeo = new THREE.CylinderGeometry(0.08, 0.08, 1, 16);
      const postMat = new THREE.MeshStandardMaterial({ color: 0x64748b, metalness: 0.9 });
      const post1 = new THREE.Mesh(postGeo, postMat);
      post1.position.set(TABLE_WIDTH/2 + 0.3, 0.4, 0);
      const post2 = post1.clone();
      post2.position.x = -TABLE_WIDTH/2 - 0.3;
      scene.add(post1);
      scene.add(post2);
    }

    function createRealisticPaddle(rubberColor) {
      const paddleGroup = new THREE.Group();

      const headShape = new THREE.Shape();
      headShape.absarc(0, 0.3, 1.1, 0, Math.PI * 2, false);
      const extrudeSettings = { depth: 0.12, bevelEnabled: true, bevelSegments: 4, steps: 1, bevelSize: 0.05, bevelThickness: 0.05 };
      const headGeo = new THREE.ExtrudeGeometry(headShape, extrudeSettings);
      const headMat = new THREE.MeshStandardMaterial({ color: rubberColor, roughness: 0.3 });
      const head = new THREE.Mesh(headGeo, headMat);
      head.castShadow = true;
      paddleGroup.add(head);

      const woodMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.4 });
      const handleGeo = new THREE.CylinderGeometry(0.18, 0.22, 1.3, 16);
      const handle = new THREE.Mesh(handleGeo, woodMat);
      handle.position.set(0, -1.0, 0.06);
      handle.castShadow = true;
      paddleGroup.add(handle);

      paddleGroup.scale.set(1.15, 1.15, 1.15);
      return paddleGroup;
    }

    function createBall() {
      const ballGeo = new THREE.SphereGeometry(0.32, 32, 32);
      const ballMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1, metalness: 0.1 });
      ball = new THREE.Mesh(ballGeo, ballMat);
      ball.castShadow = true;
      scene.add(ball);
      resetBall();
    }

    function resetBall() {
      ball.position.set(0, 2, TABLE_DEPTH / 2 - 2);
      ballVelocity.set((Math.random() - 0.5) * 0.08, 0.1, -0.25);
      lastHitter = 'player';
      tableBounces = 0;
    }

    function startGame(difficulty) {
      currentDifficulty = difficulty;
      playerScore = 0;
      botScore = 0;
      updateScoreUI();
      document.getElementById('menu').style.display = 'none';
      gameActive = true;
      resetBall();
    }

    function onMouseMove(e) {
      mousePos.x = (e.clientX / window.innerWidth) * 2 - 1;
      mousePos.y = -(e.clientY / window.innerHeight) * 2 + 1;

      if (gameActive) {
        playerPaddleGroup.position.x = mousePos.x * (TABLE_WIDTH / 2 + 1);
        playerPaddleGroup.position.y = Math.max(0.5, Math.min(4.5, (mousePos.y + 1) * 2.5));
      }
    }

    function onMouseClick() {
      if (!gameActive) return;

      isHitting = true;
      playerPaddleGroup.position.z -= 0.6;

      setTimeout(() => {
        playerPaddleGroup.position.z = TABLE_DEPTH / 2 - 1;
        isHitting = false;
      }, 120);
    }

    function updateBot() {
      if (!gameActive) return;

      const config = botConfig[currentDifficulty];
      
      let targetX = ball.position.x * config.precision;
      let targetY = Math.max(0.8, ball.position.y);

      botPaddleGroup.position.x += (targetX - botPaddleGroup.position.x) * config.speed;
      botPaddleGroup.position.y += (targetY - botPaddleGroup.position.y) * config.speed;

      botPaddleGroup.position.x = Math.max(-TABLE_WIDTH/2, Math.min(TABLE_WIDTH/2, botPaddleGroup.position.x));
      botPaddleGroup.position.y = Math.max(0.8, Math.min(4, botPaddleGroup.position.y));

      const distZ = ball.position.z - botPaddleGroup.position.z;
      if (distZ <= 1.2 && distZ >= -0.5 && ballVelocity.z < 0) {
        const dx = Math.abs(ball.position.x - botPaddleGroup.position.x);
        const dy = Math.abs(ball.position.y - botPaddleGroup.position.y);

        if (dx < 2.0 && dy < 2.0) {
          ballVelocity.z = Math.abs(ballVelocity.z);
          ballVelocity.x = (playerPaddleGroup.position.x - botPaddleGroup.position.x) * 0.08;
          ballVelocity.y = 0.12;

          lastHitter = 'bot';
          tableBounces = 0;
          playSound('hit');
        }
      }
    }

    function scorePoint(winner) {
      if (winner === 'player') {
        playerScore++;
      } else {
        botScore++;
      }
      playSound('score');
      updateScoreUI();
      checkGameOver() || resetBall();
    }

    function updatePhysics() {
      if (!gameActive) return;

      ballVelocity.y += GRAVITY;
      ball.position.add(ballVelocity);

      const onTableX = Math.abs(ball.position.x) <= TABLE_WIDTH / 2;
      const onTableZ = Math.abs(ball.position.z) <= TABLE_DEPTH / 2;

      if (ball.position.y <= 0.32 && onTableX && onTableZ) {
        ball.position.y = 0.32;
        ballVelocity.y = Math.abs(ballVelocity.y) * 0.85;
        playSound('bounce');
        tableBounces++;
      }

      if (ball.position.y < -3) {
        if (tableBounces === 0) {
          scorePoint(lastHitter === 'player' ? 'bot' : 'player');
        } else {
          scorePoint(lastHitter);
        }
        return;
      }

      const distToPlayer = playerPaddleGroup.position.z - ball.position.z;
      const hitPrompt = document.getElementById('hit-prompt');
      
      if (distToPlayer > 0 && distToPlayer < 4.5 && ballVelocity.z > 0) {
        hitPrompt.style.opacity = '1';
      } else {
        hitPrompt.style.opacity = '0';
      }

      if (distToPlayer <= 1.0 && distToPlayer >= -0.3) {
        const dx = Math.abs(ball.position.x - playerPaddleGroup.position.x);
        const dy = Math.abs(ball.position.y - playerPaddleGroup.position.y);

        if (dx < 1.8 && dy < 1.8 && isHitting) {
          ballVelocity.z = -Math.abs(ballVelocity.z) * 1.03 - 0.02;
          ballVelocity.x = (ball.position.x - playerPaddleGroup.position.x) * 0.12;
          ballVelocity.y = 0.12;
          
          lastHitter = 'player';
          tableBounces = 0;
          playSound('hit');
        }
      }
    }

    function updateScoreUI() {
      document.getElementById('player-score').innerText = playerScore;
      document.getElementById('bot-score').innerText = botScore;
    }

    function checkGameOver() {
      if (playerScore >= 5 || botScore >= 5) {
        gameActive = false;
        setTimeout(() => {
          alert(playerScore >= 5 ? 'VOCÊ VENCEU A PARTIDA! 🏆' : 'O BOT VENCEU! 🤖');
          document.getElementById('menu').style.display = 'block';
        }, 100);
        return true;
      }
      return false;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      updateBot();
      updatePhysics();
      renderer.render(scene, camera);
    }

    init();
  </script>
</body>
</html>
