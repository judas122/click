<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tower Leap 2D</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body, html { width: 100%; height: 100%; background: #0b0d12; color: #fff; font-family: 'Press Start 2P', cursive, monospace; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    #game-container { position: relative; display: flex; width: 100vw; height: 100vh; background: #87ceeb; }
    #shop-panel { width: 260px; height: 100%; background: #5c3a21; border-right: 6px solid #3d2314; outline: 4px solid #2e7d32; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; z-index: 10; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
    h2 { color: #ffd700; font-size: 11px; text-align: center; line-height: 1.4; margin-bottom: 16px; text-shadow: 2px 2px #000; }
    .ui-info { font-size: 8px; color: #e2d8b3; margin-bottom: 10px; line-height: 1.5; text-shadow: 1px 1px #000; }
    .btn { background: #4a7c59; color: #fff; border: 3px solid #2d4a35; padding: 10px 8px; margin: 8px 0; font-family: 'Press Start 2P', cursive; font-size: 7px; line-height: 1.3; cursor: pointer; border-radius: 4px; box-shadow: 0 4px #1b3022; width: 100%; }
    .btn:hover:not(:disabled) { background: #5b996f; transform: translateY(-2px); box-shadow: 0 6px #1b3022; }
    .btn:disabled { background: #3a473d; color: #7a8a7e; border-color: #252e27; box-shadow: none; cursor: not-allowed; }
    canvas { display: block; flex-grow: 1; height: 100%; image-rendering: pixelated; }
    .hud-top { position: absolute; top: 15px; right: 25px; font-size: 10px; color: #ffffff; text-shadow: 2px 2px #000; pointer-events: none; display: flex; gap: 20px; z-index: 20; }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="shop-panel">
      <div>
        <h2>LOJINHA 🌿</h2>
        <div class="ui-info" id="stats-info">Bicho: Pintinho 🐥</div>
        <div class="ui-info" id="flaps-info">Pulos no ar: 2</div>
        <button id="buy-tower" class="btn" onclick="buyTower()">Aumentar Torre<br><span id="cost-tower">10 moedas</span></button>
        <button id="buy-pet" class="btn" onclick="buyPet()">Evoluir Bicho<br><span id="cost-pet">50 moedas</span></button>
      </div>
      <div class="ui-info" style="color: #a3e635; font-size: 7px; line-height: 1.5;">
        Como joga:<br>A/D - Anda<br>W - Pula<br>Espaço/W no ar - Bate asa
      </div>
    </div>
    <div style="position: relative; flex-grow: 1; height: 100%;">
      <div class="hud-top">
        <div id="coin-display">💰 0</div>
        <div id="record-display">🏆 0m</div>
      </div>
      <canvas id="canvas"></canvas>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth || window.innerWidth - 260;
      canvas.height = canvas.parentElement.clientHeight || window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let coins = 0;
    let maxDistance = 0;
    let gameState = 'TOWER';

    const spriteSheet = new Image();
    let isLoaded = false;
    spriteSheet.onload = () => { isLoaded = true; };
    spriteSheet.src = 'bichos.png-removebg-preview.png';

    const animals = [
      { name: "Pintinho 🐥", speed: 5, gravity: 0.22, flapPower: -5.5, maxFlaps: 2, frame: 0, size: 64 },
      { name: "Galinha 🐔", speed: 6.5, gravity: 0.20, flapPower: -6.5, maxFlaps: 3, frame: 1, size: 68 },
      { name: "Passarinho 🐦", speed: 8, gravity: 0.17, flapPower: -7.0, maxFlaps: 4, frame: 2, size: 64 },
      { name: "Águia 🦅", speed: 10, gravity: 0.14, flapPower: -8.0, maxFlaps: 6, frame: 3, size: 76 },
      { name: "Dragão 🐉", speed: 13, gravity: 0.11, flapPower: -9.0, maxFlaps: 10, frame: 4, size: 84 }
    ];

    let towerLevel = 1;
    let petIndex = 0;
    const keys = { a: false, d: false, w: false, space: false };

    let player = {
      x: 80,
      y: 100,
      vx: 0,
      vy: 0,
      isGrounded: false,
      flapsLeft: 2,
      width: 64,
      height: 64
    };

    window.addEventListener('keydown', (e) => {
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.a = true;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.d = true;
      if (e.code === 'KeyW' || e.code === 'ArrowUp') { if (!keys.w) handleJump(); keys.w = true; }
      if (e.code === 'Space') { if (!keys.space) handleJump(); keys.space = true; }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.a = false;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.d = false;
      if (e.code === 'KeyW' || e.code === 'ArrowUp') keys.w = false;
      if (e.code === 'Space') keys.space = false;
    });

    function updateUI() {
      document.getElementById('coin-display').innerText = `💰 ${Math.floor(coins)}`;
      document.getElementById('record-display').innerText = `🏆 ${Math.floor(maxDistance)}m`;
      const currentPet = animals[petIndex];
      document.getElementById('stats-info').innerText = `Bicho: ${currentPet.name}`;
      document.getElementById('flaps-info').innerText = `Pulos no ar: ${currentPet.maxFlaps}`;
      const towerCost = Math.floor(10 * Math.pow(1.5, towerLevel - 1));
      document.getElementById('buy-tower').disabled = coins < towerCost;
      document.getElementById('buy-tower').innerHTML = `Aumentar Torre (Nv.${towerLevel})<br><span id="cost-tower">${towerCost} moedas</span>`;
      if (petIndex < animals.length - 1) {
        const petCost = Math.floor(50 * Math.pow(2.0, petIndex));
        document.getElementById('buy-pet').disabled = coins < petCost;
        document.getElementById('buy-pet').innerHTML = `Evoluir Bicho<br><span id="cost-pet">${petCost} moedas</span>`;
      } else {
        document.getElementById('buy-pet').disabled = true;
        document.getElementById('buy-pet').innerHTML = `Virou o Dragão!`;
      }
    }

    function buyTower() {
      const cost = Math.floor(10 * Math.pow(1.5, towerLevel - 1));
      if (coins >= cost) { coins -= cost; towerLevel++; resetToTower(); updateUI(); }
    }

    function buyPet() {
      const cost = Math.floor(50 * Math.pow(2.0, petIndex));
      if (coins >= cost && petIndex < animals.length - 1) {
        coins -= cost;
        petIndex++;
        player.width = animals[petIndex].size;
        player.height = animals[petIndex].size;
        resetToTower();
        updateUI();
      }
    }

    function resetToTower() {
      resizeCanvas();
      gameState = 'TOWER';
      const groundY = canvas.height - 80;
      const towerHeight = 150 + (towerLevel * 60);
      player.x = 80;
      player.y = groundY - towerHeight - player.height;
      player.vx = 0;
      player.vy = 0;
      player.isGrounded = true;
      player.flapsLeft = animals[petIndex].maxFlaps;
    }

    function handleJump() {
      if (gameState === 'TOWER') {
        if (player.isGrounded) { player.vy = -8.0; player.isGrounded = false; }
      } else if (gameState === 'FLYING') {
        if (player.flapsLeft > 0) { player.vy = animals[petIndex].flapPower; player.flapsLeft--; }
      }
    }

    function gameLoop() {
      if (canvas.width === 0 || canvas.height === 0) resizeCanvas();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const towerWidth = 240;
      const groundY = canvas.height - 80;
      const towerHeight = 150 + (towerLevel * 60);
      const towerTopY = groundY - towerHeight;

      if (gameState === 'TOWER') {
        if (keys.a) player.vx = -3.5;
        else if (keys.d) player.vx = 3.5;
        else player.vx = 0;

        player.vy += 0.35;
        player.x += player.vx;
        player.y += player.vy;

        if (player.x < 15) player.x = 15;

        if (player.x <= towerWidth) {
          if (player.y >= towerTopY - player.height) {
            player.y = towerTopY - player.height;
            player.vy = 0;
            player.isGrounded = true;
          }
        } else {
          gameState = 'FLYING';
          player.isGrounded = false;
          player.vx = animals[petIndex].speed + (player.vx > 0 ? 2 : 0);
          if (player.vy < 0) { player.vy -= 2.5; player.vx += 2.0; }
        }
      } else if (gameState === 'FLYING') {
        player.vy += animals[petIndex].gravity;
        player.x += player.vx;
        player.y += player.vy;
        player.vx = Math.max(1.5, player.vx - 0.004);

        if (player.y >= groundY - player.height) {
          player.y = groundY - player.height;
          gameState = 'GAMEOVER';
          const distanceEarned = Math.floor(player.x - towerWidth);
          const earnedCoins = Math.max(0, Math.floor(distanceEarned / 12));
          coins += earnedCoins;
          if (distanceEarned > maxDistance) maxDistance = distanceEarned;
          setTimeout(() => { resetToTower(); updateUI(); }, 1200);
        }
      }

      let cameraX = Math.max(0, player.x - 200);
      let cameraY = player.y - (canvas.height / 2);

      ctx.save();
      ctx.translate(-cameraX, -cameraY);

      ctx.fillStyle = '#87ceeb';
      ctx.fillRect(cameraX, cameraY, canvas.width, canvas.height + Math.abs(cameraY));

      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.fillRect(150, 100, 90, 30);
      ctx.fillRect(600, 180, 100, 30);
      ctx.fillRect(1100, 80, 120, 35);

      // Torre com corte limpo nas bordas para alinhar os tijolos perfeitamente
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, towerTopY, towerWidth, towerHeight);
      ctx.clip();

      ctx.fillStyle = '#8b4513';
      ctx.fillRect(0, towerTopY, towerWidth, towerHeight);
      ctx.fillStyle = '#6a320b';
      for (let ty = towerTopY; ty < groundY; ty += 16) {
        for (let tx = 0; tx < towerWidth; tx += 32) {
          let shift = (Math.floor(ty / 16) % 2 === 0) ? 0 : 16;
          ctx.fillRect(tx + shift, ty, 30, 14);
        }
      }
      ctx.restore();

      ctx.fillStyle = '#4ca64c';
      ctx.fillRect(0, towerTopY - 6, towerWidth + 4, 8);
      ctx.fillStyle = '#2e7d32';
      ctx.fillRect(0, towerTopY - 2, towerWidth + 4, 4);

      ctx.fillStyle = '#8b5a2b';
      ctx.fillRect(-200, groundY, cameraX + canvas.width + 1000, 1000);
      ctx.fillStyle = '#4ca64c';
      ctx.fillRect(-200, groundY, cameraX + canvas.width + 1000, 12);
      ctx.fillStyle = '#2e7d32';
      ctx.fillRect(-200, groundY + 10, cameraX + canvas.width + 1000, 4);

      ctx.fillStyle = '#fff';
      ctx.font = '8px "Press Start 2P"';
      for (let d = 300; d < player.x + 1500; d += 200) {
        ctx.fillRect(d, groundY, 4, 16);
        ctx.fillText(`${d - towerWidth}m`, d - 14, groundY + 32);
      }

      const currentAnimal = animals[petIndex];
      if (isLoaded && spriteSheet.complete && spriteSheet.naturalHeight > 0) {
        const frameWidth = spriteSheet.naturalWidth;
        const frameHeight = spriteSheet.naturalHeight / 5;

        ctx.drawImage(
          spriteSheet,
          0, currentAnimal.frame * frameHeight, frameWidth, frameHeight,
          player.x, player.y, player.width, player.height
        );
      }

      if (gameState === 'FLYING') {
        ctx.fillStyle = '#2e7d32';
        ctx.font = '8px "Press Start 2P"';
        ctx.fillText(`Pulos:${player.flapsLeft}`, player.x - 10, player.y - 12);
      }

      ctx.restore();
      requestAnimationFrame(gameLoop);
    }

    resetToTower();
    updateUI();
    gameLoop();
  </script>
</body>
</html>
