<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sala do Futuro Aluno - Multi-Fases 3D Complete</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22transparent%22/><text x=%2250%%22 y=%2255%%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 font-family=%22Arial, sans-serif%22 font-weight=%22900%22 font-size=%2265%22 fill=%22%23253b6e%22>SF</text></svg>">
  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #030712;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Modal de Login */
    #login-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(3, 7, 18, 0.95);
      backdrop-filter: blur(15px);
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .login-card {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(0, 240, 255, 0.3);
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
      border-radius: 20px;
      padding: 30px;
      width: 320px;
      text-align: center;
      color: white;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .login-card h2 { margin: 0; font-size: 22px; color: #00f0ff; }
    .login-input {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.05);
      color: #fff;
      font-size: 16px;
      outline: none;
      text-align: center;
    }
    .login-input:focus { border-color: #00f0ff; }
    .login-btn {
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #00f0ff, #7928ca);
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .hud-panel {
      position: absolute;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      color: #fff;
      padding: 15px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      z-index: 10;
      transition: all 0.3s ease-in-out;
    }

    #credits-tag {
      position: absolute;
      bottom: 15px;
      right: 15px;
      z-index: 30;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(0, 240, 255, 0.3);
      backdrop-filter: blur(8px);
      padding: 6px 12px;
      border-radius: 20px;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      pointer-events: none;
    }
    #credits-tag b { color: #00f0ff; font-weight: 800; }

    #admin-panel {
      position: absolute;
      top: 20px;
      left: 260px;
      width: 200px;
      border: 1px solid rgba(239, 68, 68, 0.5);
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
      display: none;
      flex-direction: column;
      gap: 6px;
      max-height: 80vh;
      overflow-y: auto;
    }
    #admin-panel h3 { margin: 0; font-size: 14px; color: #ef4444; text-transform: uppercase; text-align: center; }
    .admin-btn {
      padding: 6px;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: white;
      font-size: 10px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    .admin-btn:hover { background: rgba(239, 68, 68, 0.5); }

    #status-panel { top: 20px; left: 20px; width: 220px; display: flex; flex-direction: column; gap: 8px; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 6px; }
    .panel-title { font-size: 14px; font-weight: bold; color: #94a3b8; text-transform: uppercase; }
    .toggle-btn { background: rgba(255, 255, 255, 0.1); border: none; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; border-radius: 6px; padding: 4px 10px; }

    .stat-box { display: flex; flex-direction: column; }
    .stat-label { font-size: 12px; color: #94a3b8; font-weight: 600; }
    .stat-val { font-size: 22px; font-weight: 800; color: #00f0ff; word-break: break-word; }
    .sub-stat { font-size: 13px; color: #e2e8f0; font-weight: 500; }

    #settings-btn { position: absolute; top: 20px; right: 330px; z-index: 12; background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 50%; width: 45px; height: 45px; color: white; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(12px); }
    #settings-menu { position: absolute; top: 75px; right: 330px; z-index: 12; width: 220px; display: none; flex-direction: column; gap: 12px; }
    .settings-option { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .reset-save-btn { background: #ef4444 !important; color: white !important; font-weight: bold; width: 100%; margin-top: 5px; padding: 6px 10px; border-radius: 6px; border: none; cursor: pointer; }

    #shop-panel { top: 20px; right: 20px; width: 290px; display: flex; flex-direction: column; gap: 10px; max-height: 85vh; overflow-y: auto; }
    #shop-panel h3 { margin: 0 0 5px 0; font-size: 18px; color: #ff007f; text-transform: uppercase; text-align: center; }
    .shop-btn { width: 100%; padding: 10px 12px; background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; color: white; font-weight: bold; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 2px; }
    .shop-btn:hover:not(:disabled) { border-color: #00f0ff; transform: translateY(-2px); }
    .shop-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .advance-phase-btn { background: linear-gradient(135deg, #8b5cf6, #d946ef) !important; border: 1px solid #f472b6 !important; animation: pulseBtn 1.5s infinite alternate; }
    @keyframes pulseBtn { 0% { transform: scale(1); } 100% { transform: scale(1.03); } }
    .phase-specific-btn { background: linear-gradient(135deg, #0284c7, #0d9488) !important; }
    .rebirth-btn { background: linear-gradient(135deg, #ff007f, #7928ca) !important; }

    #mobile-click-btn { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 15; padding: 16px 40px; font-size: 20px; font-weight: 900; color: #fff; background: linear-gradient(135deg, #00f0ff, #7928ca); border: 2px solid #ffffff; border-radius: 50px; cursor: pointer; }

    .floating-text { position: absolute; font-weight: 900; font-size: 24px; color: #00f0ff; pointer-events: none; animation: floatUp 0.8s forwards; z-index: 20; }
    @keyframes floatUp { 0% { opacity: 1; transform: translate(-50%, -50%) scale(0.8); } 100% { opacity: 0; transform: translate(-50%, -130px) scale(1); } }

    #canvas-container { width: 100vw; height: 100vh; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
</head>
<body>

  <div id="login-overlay">
    <div class="login-card">
      <h2>Entrar no Simulado</h2>
      <input type="text" id="username-input" class="login-input" placeholder="Digite seu Nick..." maxlength="20">
      <button id="login-submit-btn" class="login-btn">Jogar</button>
    </div>
  </div>

  <div id="credits-tag">Desenvolvido por: <b>luiz pedro rouba pão</b></div>

  <div id="status-panel" class="hud-panel">
    <div class="panel-header">
      <span class="panel-title">Estatísticas</span>
      <button id="toggle-status" class="toggle-btn">—</button>
    </div>
    <div class="panel-content" style="display: flex; flex-direction: column; gap: 8px; margin-top: 5px;">
      <div class="stat-box"><span class="stat-label">Jogador</span><span class="sub-stat"><b id="player-display" style="color:#facc15">Conectando...</b></span></div>
      <div class="stat-box"><span class="stat-label">Pontos</span><span id="score" class="stat-val">0</span></div>
      <div class="stat-box"><span class="stat-label">Fase Atual</span><span class="sub-stat"><b id="phase-name" style="color:#00f0ff">Fase 1</b></span></div>
      <div class="stat-box"><span class="stat-label">Objeto Atual</span><span class="sub-stat"><b id="stage-name" style="color:#fff">Objeto</b></span></div>
      <div class="stat-box"><span class="stat-label">Rebirths</span><span class="sub-stat"><b id="rebirths" style="color:#ff007f">0</b></span></div>
      <div class="stat-box"><span class="stat-label">Upgrades Visuais</span><span class="sub-stat"><b id="pets-list" style="color:#38bdf8">Nenhum</b></span></div>
    </div>
  </div>

  <div id="admin-panel" class="hud-panel">
    <h3>⚡ Admin ⚡</h3>
    <button id="adm-add-score" class="admin-btn">+1.000.000.000 Pts</button>
    <button id="adm-add-rebirth" class="admin-btn">+10 Rebirths</button>
    <button id="adm-goto-p1" class="admin-btn">Ir p/ Fase 1</button>
    <button id="adm-goto-p2" class="admin-btn">Ir p/ Fase 2</button>
    <button id="adm-goto-p3" class="admin-btn">Ir p/ Fase 3</button>
    <button id="adm-goto-p4" class="admin-btn">Ir p/ Fase 4</button>
    <button id="adm-goto-p5" class="admin-btn">Ir p/ Fase 5</button>
    <button id="adm-goto-p6" class="admin-btn">Ir p/ Fase 6</button>
  </div>

  <button id="settings-btn">⚙️</button>
  <div id="settings-menu" class="hud-panel">
    <div class="panel-header"><span class="panel-title">Opções</span></div>
    <div class="settings-option"><span>Música</span><button id="toggle-music-btn" class="toggle-btn">🔊 ON</button></div>
    <div class="settings-option"><span>Botão Clicar</span><button id="toggle-click-btn" class="toggle-btn">👁️ VISÍVEL</button></div>
    <button id="reset-save-btn" class="reset-save-btn">🗑️ Resetar Jogo</button>
  </div>

  <div id="shop-panel" class="hud-panel">
    <h3>Loja de Upgrades</h3>
    <button id="btn-advance-phase" class="shop-btn advance-phase-btn" style="display: none;">
      <span id="advance-text">🚀 Próxima Fase</span>
      <small>Portal Aberto!</small>
    </button>

    <button id="buy-click" class="shop-btn"><span>Dobrar Clique (x2)</span><small>Custo: <span id="cost-click">10</span> pts</small></button>
    <button id="buy-auto" class="shop-btn"><span>Comprar Auto-Clicker (+1/s)</span><small>Custo: <span id="cost-auto">25</span> pts</small></button>

    <div id="p2-shop" style="display: none; flex-direction: column; gap: 8px;">
      <button id="buy-ring" class="shop-btn phase-specific-btn"><span>🪐 Anel Visual 3D (+100%)</span><small>Custo: <span id="cost-ring">500</span></small></button>
    </div>

    <div id="p3-shop" style="display: none; flex-direction: column; gap: 8px;">
      <button id="buy-sauce" class="shop-btn phase-specific-btn"><span>🌶️ Molho Picante (x3 Pts)</span><small>Custo: <span id="cost-sauce">100.000</span></small></button>
    </div>

    <div id="p4-shop" style="display: none; flex-direction: column; gap: 8px;">
      <button id="buy-neon" class="shop-btn phase-specific-btn"><span>🌆 Aura/Cubo Cyber 3D (x4 Pts)</span><small>Custo: <span id="cost-neon">10.000.000</span></small></button>
    </div>

    <div id="p5-shop" style="display: none; flex-direction: column; gap: 8px;">
      <button id="buy-orb" class="shop-btn phase-specific-btn"><span>🔮 Esfera Mana 3D (x10 Pts)</span><small>Custo: <span id="cost-orb">200.000.000</span></small></button>
      <button id="btn-challenge-p5" class="shop-btn phase-specific-btn" style="background: linear-gradient(135deg, #a855f7, #6366f1) !important;">
        <span>📜 Desafio Místico: Quebrar Selo</span>
        <small id="challenge-status">Status: Selado 🔒</small>
      </button>
    </div>

    <div id="p6-shop" style="display: none; flex-direction: column; gap: 8px;">
      <button id="buy-quantum" class="shop-btn phase-specific-btn"><span>⚛️ Anéis Quânticos 3D (x20 Pts)</span><small>Custo: <span id="cost-quantum">10.000.000.000</span></small></button>
    </div>

    <button id="buy-rebirth" class="shop-btn rebirth-btn"><span>REBIRTH</span><small>Requer: <span id="cost-rebirth">1.000</span> pts</small></button>
  </div>

  <button id="mobile-click-btn">CLICAR! 👆</button>
  <div id="canvas-container"></div>

  <audio id="bg-music" loop preload="auto">
    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg">
  </audio>

  <script>
    let username = "", score = 0, clickPower = 1, autoClickers = 0, rebirths = 0, currentPhase = 1;
    let costClick = 10, costAuto = 25, costRebirth = 1000;
    
    let hasSaturnRing = false, hasNeonAura = false, hasManaOrb = false, hasQuantumCore = false;
    let costRing = 500, costNeon = 10000000, costOrb = 200000000, costQuantum = 10000000000;
    let phase5ChallengeDone = false;

    let currentStage = 0, musicStarted = false, isMuted = false, isClickBtnVisible = true;
    let targetScale = new THREE.Vector3(1, 1, 1);

    const phaseThresholds = { 1: 0, 2: 1000, 3: 50000, 4: 5000000, 5: 100000000, 6: 5000000000 };

    function saveGame() {
      if(!username) return;
      const saveData = {
        username, score, clickPower, autoClickers, rebirths, currentPhase,
        costClick, costAuto, costRebirth, hasSaturnRing, hasNeonAura,
        hasManaOrb, hasQuantumCore, phase5ChallengeDone, currentStage, isMuted, isClickBtnVisible
      };
      localStorage.setItem('3d_clicker_save_v2', JSON.stringify(saveData));
    }

    function loadGame() {
      const saved = localStorage.getItem('3d_clicker_save_v2');
      if (saved) {
        try {
          const data = JSON.parse(saved);
          username = data.username ?? ""; score = data.score ?? 0;
          clickPower = data.clickPower ?? 1; autoClickers = data.autoClickers ?? 0;
          rebirths = data.rebirths ?? 0; currentPhase = data.currentPhase ?? 1;
          costClick = data.costClick ?? 10; costAuto = data.costAuto ?? 25;
          costRebirth = data.costRebirth ?? 1000;
          hasSaturnRing = data.hasSaturnRing ?? false;
          hasNeonAura = data.hasNeonAura ?? false;
          hasManaOrb = data.hasManaOrb ?? false;
          hasQuantumCore = data.hasQuantumCore ?? false;
          phase5ChallengeDone = data.phase5ChallengeDone ?? false;
          currentStage = data.currentStage ?? 0;
          isMuted = data.isMuted ?? false;
          isClickBtnVisible = data.isClickBtnVisible ?? true;
        } catch(e) {}
      }
    }

    loadGame();

    const loginOverlay = document.getElementById('login-overlay');
    const usernameInput = document.getElementById('username-input');
    const loginSubmitBtn = document.getElementById('login-submit-btn');
    const adminPanel = document.getElementById('admin-panel');
    const playerDisplay = document.getElementById('player-display');

    /* VALIDAÇÃO DE NICK ADMIN ATUALIZADA */
    function checkAdminStatus(name) {
      if (name.trim().toLowerCase() === "patricia") {
        adminPanel.style.display = "flex";
      } else {
        adminPanel.style.display = "none";
      }
    }

    function initUser(name) {
      username = name.trim();
      playerDisplay.textContent = username;
      checkAdminStatus(username);
      loginOverlay.style.display = 'none';
      saveGame();
    }

    if (username) initUser(username);

    loginSubmitBtn.addEventListener('click', () => { if (usernameInput.value.trim()) initUser(usernameInput.value); });
    usernameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') loginSubmitBtn.click(); });

    // Admin
    document.getElementById('adm-add-score').addEventListener('click', () => { score += 1000000000; updateUI(); saveGame(); });
    document.getElementById('adm-add-rebirth').addEventListener('click', () => { rebirths += 10; updateUI(); saveGame(); });
    document.getElementById('adm-goto-p1').addEventListener('click', () => { currentPhase = 1; buildMesh(); updateUI(); saveGame(); });
    document.getElementById('adm-goto-p2').addEventListener('click', () => { currentPhase = 2; buildMesh(); updateUI(); saveGame(); });
    document.getElementById('adm-goto-p3').addEventListener('click', () => { currentPhase = 3; buildMesh(); updateUI(); saveGame(); });
    document.getElementById('adm-goto-p4').addEventListener('click', () => { currentPhase = 4; buildMesh(); updateUI(); saveGame(); });
    document.getElementById('adm-goto-p5').addEventListener('click', () => { currentPhase = 5; buildMesh(); updateUI(); saveGame(); });
    document.getElementById('adm-goto-p6').addEventListener('click', () => { currentPhase = 6; buildMesh(); updateUI(); saveGame(); });

    const bgMusic = document.getElementById('bg-music');
    bgMusic.volume = 0.25;
    function startMusic() { if (!musicStarted && !isMuted) { bgMusic.play().catch(() => {}); musicStarted = true; } }

    const settingsBtn = document.getElementById('settings-btn');
    const settingsMenu = document.getElementById('settings-menu');
    settingsBtn.addEventListener('click', (e) => { e.stopPropagation(); settingsMenu.style.display = settingsMenu.style.display === 'flex' ? 'none' : 'flex'; });
    document.addEventListener('click', (e) => { if (!settingsMenu.contains(e.target) && e.target !== settingsBtn) settingsMenu.style.display = 'none'; });

    document.getElementById('toggle-music-btn').addEventListener('click', () => {
      isMuted = !isMuted; bgMusic.pause();
      document.getElementById('toggle-music-btn').textContent = isMuted ? '🔇 OFF' : '🔊 ON';
      if(!isMuted) bgMusic.play().catch(() => {}); saveGame();
    });

    document.getElementById('toggle-click-btn').addEventListener('click', () => {
      isClickBtnVisible = !isClickBtnVisible;
      document.getElementById('mobile-click-btn').style.display = isClickBtnVisible ? 'block' : 'none';
      document.getElementById('toggle-click-btn').textContent = isClickBtnVisible ? '👁️ VISÍVEL' : '🙈 OCULTO';
      saveGame();
    });

    document.getElementById('reset-save-btn').addEventListener('click', () => {
      if (confirm("Resetar todo o seu progresso?")) { localStorage.removeItem('3d_clicker_save_v2'); location.reload(); }
    });

    const stagesPhase1 = [
      { name: "Cubo Inicial", req: 0, createGeo: () => new THREE.BoxGeometry(1.8, 1.8, 1.8) },
      { name: "Octaedro", req: 100, createGeo: () => new THREE.OctahedronGeometry(1.5) },
      { name: "Anel Toroidal", req: 500, createGeo: () => new THREE.TorusGeometry(1.2, 0.4, 16, 100) }
    ];

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 6;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const mainLight = new THREE.PointLight(0x00f0ff, 2, 100); mainLight.position.set(5, 5, 5); scene.add(mainLight);
    const secondLight = new THREE.PointLight(0xff007f, 1.5, 100); secondLight.position.set(-5, -5, -2); scene.add(secondLight);
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));

    let currentMesh = null;
    let saturnRingMesh = null, neonCubeMesh = null, manaOrbMesh = null, quantumCoreMesh = null;
    let starParticles = null;

    function setupPhase6Background() {
      if (starParticles) scene.remove(starParticles);
      const starsGeo = new THREE.BufferGeometry();
      const count = 1200;
      const positions = new Float32Array(count * 3);
      for(let i=0; i<count*3; i+=3) {
        positions[i] = (Math.random() - 0.5) * 40;
        positions[i+1] = (Math.random() - 0.5) * 40;
        positions[i+2] = (Math.random() - 0.5) * 100;
      }
      starsGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const starsMat = new THREE.PointsMaterial({ color: 0x38bdf8, size: 0.15, transparent: true, opacity: 0.8 });
      starParticles = new THREE.Points(starsGeo, starsMat);
      starParticles.visible = false;
      scene.add(starParticles);
    }
    setupPhase6Background();

    function buildMesh() {
      if (currentMesh) scene.remove(currentMesh);
      targetScale.set(1, 1, 1);
      
      if (starParticles) starParticles.visible = (currentPhase === 6);

      const rootGroup = new THREE.Group();

      if (currentPhase === 1) {
        const stage = stagesPhase1[currentStage] || stagesPhase1[0];
        const main = new THREE.Mesh(stage.createGeo(), new THREE.MeshStandardMaterial({ color: 0x00f0ff, roughness: 0.2, metalness: 0.8 }));
        rootGroup.add(main);
        document.getElementById('stage-name').textContent = stage.name;
        document.getElementById('phase-name').textContent = "Fase 1: Geometria";
      } 
      else if (currentPhase === 2) {
        const main = new THREE.Mesh(new THREE.SphereGeometry(1.2, 32, 32), new THREE.MeshStandardMaterial({ color: 0x22d3ee, roughness: 0.6 }));
        rootGroup.add(main);
        document.getElementById('stage-name').textContent = `Planeta Galáctico`;
        document.getElementById('phase-name').textContent = "Fase 2: Planetas 🌌";
      }
      else if (currentPhase === 3) {
        const main = new THREE.Mesh(new THREE.TorusGeometry(1.3, 0.6, 24, 60), new THREE.MeshStandardMaterial({ color: 0xf472b6, roughness: 0.3 }));
        rootGroup.add(main);
        document.getElementById('stage-name').textContent = "🍩 Donut Galáctico";
        document.getElementById('phase-name').textContent = "Fase 3: Gastronomia 🍔";
      }
      else if (currentPhase === 4) {
        const main = new THREE.Mesh(new THREE.IcosahedronGeometry(1.4, 1), new THREE.MeshStandardMaterial({ color: 0xec4899, wireframe: true }));
        rootGroup.add(main);
        document.getElementById('stage-name').textContent = "🌆 Núcleo Cyber";
        document.getElementById('phase-name').textContent = "Fase 4: Metrópole Cyber 🤖";
      }
      else if (currentPhase === 5) {
        const main = new THREE.Mesh(new THREE.DodecahedronGeometry(1.5, 0), new THREE.MeshStandardMaterial({ color: 0x6366f1, roughness: 0.1, metalness: 0.5 }));
        rootGroup.add(main);
        document.getElementById('stage-name').textContent = "🔮 Cristal de Mana";
        document.getElementById('phase-name').textContent = "Fase 5: Reino Místico ✨";
      }
      else if (currentPhase === 6) {
        const main = new THREE.Mesh(new THREE.TorusKnotGeometry(1.1, 0.3, 100, 16), new THREE.MeshStandardMaterial({ color: 0x3b82f6, metalness: 0.9, roughness: 0.1 }));
        rootGroup.add(main);
        document.getElementById('stage-name').textContent = "⚛️ Nó Quântico Multidimensional";
        document.getElementById('phase-name').textContent = "Fase 6: Dimensão Quântica 🌌";
      }

      if (hasSaturnRing) {
        saturnRingMesh = new THREE.Mesh(new THREE.RingGeometry(1.7, 2.4, 32), new THREE.MeshBasicMaterial({ color: 0xfde047, side: THREE.DoubleSide, transparent: true, opacity: 0.8 }));
        saturnRingMesh.rotation.x = Math.PI / 2.3;
        rootGroup.add(saturnRingMesh);
      }
      if (hasNeonAura) {
        neonCubeMesh = new THREE.Mesh(new THREE.BoxGeometry(2.8, 2.8, 2.8), new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true }));
        rootGroup.add(neonCubeMesh);
      }
      if (hasManaOrb) {
        manaOrbMesh = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), new THREE.MeshBasicMaterial({ color: 0xa855f7 }));
        manaOrbMesh.position.set(2.2, 0, 0);
        rootGroup.add(manaOrbMesh);
      }
      if (hasQuantumCore) {
        const ring1 = new THREE.Mesh(new THREE.TorusGeometry(2.3, 0.05, 16, 50), new THREE.MeshBasicMaterial({ color: 0x22c55e }));
        const ring2 = ring1.clone();
        ring2.rotation.x = Math.PI / 2;
        quantumCoreMesh = new THREE.Group();
        quantumCoreMesh.add(ring1); quantumCoreMesh.add(ring2);
        rootGroup.add(quantumCoreMesh);
      }

      currentMesh = rootGroup;
      scene.add(currentMesh);
    }

    function getMultipliers() {
      let mult = 1 + (rebirths * 2);
      if (hasSaturnRing) mult *= 2;
      if (hasNeonAura) mult *= 4;
      if (hasManaOrb) mult *= 10;
      if (hasQuantumCore) mult *= 20;
      return mult;
    }

    function addPoints(amount, mouseX = window.innerWidth/2, mouseY = window.innerHeight/2, spawnText = false) {
      const gain = Math.floor(amount * getMultipliers());
      score += gain;
      if (spawnText) {
        const el = document.createElement('div');
        el.className = 'floating-text';
        el.innerText = `+${gain}`;
        el.style.left = `${mouseX}px`; el.style.top = `${mouseY}px`;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 800);
      }
      updateUI();
    }

    function triggerClickAction(x, y) {
      startMusic();
      addPoints(clickPower, x, y, true);
      if (currentMesh) currentMesh.scale.addScalar(0.08);
    }

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.hud-panel') || e.target.id === 'mobile-click-btn' || e.target.closest('#settings-btn') || e.target.closest('#login-overlay')) return;
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      if (raycaster.intersectObject(currentMesh, true).length > 0) triggerClickAction(e.clientX, e.clientY);
    });

    document.getElementById('mobile-click-btn').addEventListener('click', (e) => {
      const rect = e.target.getBoundingClientRect();
      triggerClickAction(rect.left + rect.width / 2, rect.top);
    });

    document.getElementById('btn-advance-phase').addEventListener('click', () => {
      const nextP = currentPhase + 1;
      if (currentPhase === 5 && !phase5ChallengeDone) {
        alert("🔒 Você precisa quebrar o Selo Místico na loja da Fase 5 para liberar a Fase 6!");
        return;
      }
      if (nextP <= 6 && score >= phaseThresholds[nextP]) {
        currentPhase = nextP;
        buildMesh(); updateUI(); saveGame();
      }
    });

    document.getElementById('buy-click').addEventListener('click', () => { if (score >= costClick) { score -= costClick; clickPower *= 2; costClick *= 3; updateUI(); saveGame(); } });
    document.getElementById('buy-auto').addEventListener('click', () => { if (score >= costAuto) { score -= costAuto; autoClickers += 1; costAuto = Math.floor(costAuto * 1.8); updateUI(); saveGame(); } });

    document.getElementById('buy-ring').addEventListener('click', () => { if (score >= costRing && !hasSaturnRing) { score -= costRing; hasSaturnRing = true; buildMesh(); updateUI(); saveGame(); } });
    document.getElementById('buy-neon').addEventListener('click', () => { if (score >= costNeon && !hasNeonAura) { score -= costNeon; hasNeonAura = true; buildMesh(); updateUI(); saveGame(); } });
    document.getElementById('buy-orb').addEventListener('click', () => { if (score >= costOrb && !hasManaOrb) { score -= costOrb; hasManaOrb = true; buildMesh(); updateUI(); saveGame(); } });
    document.getElementById('buy-quantum').addEventListener('click', () => { if (score >= costQuantum && !hasQuantumCore) { score -= costQuantum; hasQuantumCore = true; buildMesh(); updateUI(); saveGame(); } });

    document.getElementById('btn-challenge-p5').addEventListener('click', () => {
      if (phase5ChallengeDone) { alert("O Selo Místico já foi quebrado!"); return; }
      const spells = ["LUMOS", "ALOHOMORA", "IPSUM", "AVADA", "PROTEGO"];
      const targetSpell = spells[Math.floor(Math.random() * spells.length)];
      const answer = prompt(`📜 DESAFIO MÍSTICO:\nDigite a palavra de conjuração exata: "${targetSpell}"`);
      if (answer && answer.trim().toUpperCase() === targetSpell) {
        phase5ChallengeDone = true;
        alert("✨ SELO MÍSTICO QUEBRADO COM SUCESSO! Portal para a Fase 6 desbloqueado!");
        updateUI(); saveGame();
      } else {
        alert("❌ Conjuração incorreta! Tente novamente.");
      }
    });

    document.getElementById('buy-rebirth').addEventListener('click', () => {
      if (score >= costRebirth) {
        rebirths++; score = 0; clickPower = 1; autoClickers = 0; costClick = 10; costAuto = 25; costRebirth *= 4;
        buildMesh(); updateUI(); saveGame();
      }
    });

    setInterval(() => { if (autoClickers > 0) addPoints(autoClickers, window.innerWidth / 2, window.innerHeight / 2, false); }, 1000);
    setInterval(saveGame, 5000);

    function updateUI() {
      document.getElementById('score').textContent = score.toLocaleString();
      document.getElementById('rebirths').textContent = rebirths;
      document.getElementById('cost-click').textContent = costClick.toLocaleString();
      document.getElementById('cost-auto').textContent = costAuto.toLocaleString();
      document.getElementById('cost-rebirth').textContent = costRebirth.toLocaleString();

      document.getElementById('buy-click').disabled = score < costClick;
      document.getElementById('buy-auto').disabled = score < costAuto;
      document.getElementById('buy-rebirth').disabled = score < costRebirth;

      const nextPhase = currentPhase + 1;
      if (nextPhase <= 6 && score >= phaseThresholds[nextPhase]) {
        document.getElementById('btn-advance-phase').style.display = 'flex';
        document.getElementById('advance-text').textContent = `🌌 Entrar na Fase ${nextPhase}`;
      } else {
        document.getElementById('btn-advance-phase').style.display = 'none';
      }

      document.getElementById('p2-shop').style.display = currentPhase === 2 ? 'flex' : 'none';
      document.getElementById('p3-shop').style.display = currentPhase === 3 ? 'flex' : 'none';
      document.getElementById('p4-shop').style.display = currentPhase === 4 ? 'flex' : 'none';
      document.getElementById('p5-shop').style.display = currentPhase === 5 ? 'flex' : 'none';
      document.getElementById('p6-shop').style.display = currentPhase === 6 ? 'flex' : 'none';

      document.getElementById('challenge-status').textContent = phase5ChallengeDone ? "Status: Desbloqueado 🔓" : "Status: Selado 🔒";

      let activeAttrs = [];
      if (hasSaturnRing) activeAttrs.push("Anel 3D");
      if (hasNeonAura) activeAttrs.push("Cubo Cyber 3D");
      if (hasManaOrb) activeAttrs.push("Esfera 3D");
      if (hasQuantumCore) activeAttrs.push("Anéis Quânticos 3D");
      document.getElementById('pets-list').textContent = activeAttrs.length > 0 ? activeAttrs.join(", ") : "Nenhum";
    }

    let orbAngle = 0;
    function animate() {
      requestAnimationFrame(animate);
      if (currentMesh) {
        currentMesh.rotation.y += 0.008;
        currentMesh.rotation.x += 0.003;
        currentMesh.scale.lerp(targetScale, 0.1);
      }

      if (neonCubeMesh) { neonCubeMesh.rotation.x += 0.01; neonCubeMesh.rotation.y += 0.01; }
      if (manaOrbMesh) {
        orbAngle += 0.03;
        manaOrbMesh.position.x = Math.cos(orbAngle) * 2.3;
        manaOrbMesh.position.z = Math.sin(orbAngle) * 2.3;
      }
      if (quantumCoreMesh) { quantumCoreMesh.rotation.z += 0.03; quantumCoreMesh.rotation.y += 0.02; }

      if (starParticles && starParticles.visible) {
        const positions = starParticles.geometry.attributes.position.array;
        for (let i = 2; i < positions.length; i += 3) {
          positions[i] += 0.5;
          if (positions[i] > 20) positions[i] = -80;
        }
        starParticles.geometry.attributes.position.needsUpdate = true;
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    loadGame();
    buildMesh();
    updateUI();
    animate();
  </script>
</body>
</html>
